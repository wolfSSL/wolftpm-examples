# OpenAMP / RPMsg / remoteproc kernel options for ZCU102 R5 fwTPM.
# Without these, /sys/class/remoteproc/ and /dev/rpmsg_ctrl0 won't exist.

CONFIG_REMOTEPROC=y
CONFIG_REMOTEPROC_CDEV=y
CONFIG_ZYNQMP_R5_REMOTEPROC=y

CONFIG_RPMSG=y
CONFIG_RPMSG_VIRTIO=y
CONFIG_RPMSG_CHAR=y
CONFIG_RPMSG_CTRL=y

# Userspace mailbox / IPI access for OpenAMP
CONFIG_MAILBOX=y
CONFIG_ZYNQMP_IPI_MBOX=y
