#
# HSS Payload Generator - AMP configuration for the fwTPM server on U54 hart 4
#
# Boots Linux (via U-Boot) on harts 1-3 and the bare-metal fwTPM server
# (fwtpm_u54.elf) on hart 4 in M-mode.
#
# Usage:
#   hss-payload-generator -vvv -c amp-fwtpm.yaml payload.bin
#
# The u-boot.bin must be available (from Yocto build or standalone).
# The fwtpm_u54.elf is built by this project's Makefile.
#

set-name: 'PolarFire-SoC-HSS::Linux + fwTPM'

hart-entry-points: {
  u54_1: '0x80200000',
  u54_2: '0x80200000',
  u54_3: '0x80200000',
  u54_4: '0x91C00000'
}

payloads:
  u-boot.bin: {
    exec-addr: '0x80200000',
    owner-hart: u54_1,
    secondary-hart: u54_2,
    secondary-hart: u54_3,
    priv-mode: prv_s
  }
  fwtpm_u54.elf: {
    exec-addr: '0x91C00000',
    owner-hart: u54_4,
    priv-mode: prv_m,
    skip-opensbi: true
  }
